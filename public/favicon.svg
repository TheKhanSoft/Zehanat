<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark Navy/Slate Background -->
  <rect width="512" height="512" rx="120" fill="#020617" />
  
  <!-- Outer Glow Ring -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="url(#tealGrad)" stroke-width="12" opacity="0.3" filter="url(#glow)" />
  
  <!-- Stylized Letter Z -->
  <path d="M140 160 L372 160 L140 352 L372 352" fill="none" stroke="url(#tealGrad)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
